name: CI / Production Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, Lint & Verify Workflow
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: TypeScript Type Check & Lint
        run: npm run lint

      - name: Execute Cryptographic & E2E Test Suites
        run: npm test

      - name: Compile Production Build (Vite)
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          echo "Production build output verified successfully."
